  :root {
    --accent: #e8643c;
    --serif: 'Playfair Display', ui-serif, Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --marker: 'Gochi Hand', 'Comic Sans MS', cursive;
    --hand: 'Kalam', 'Comic Sans MS', cursive;

    /* defaults (overridden per variant) */
    --bg: url("assets/bg-1.jpg");
    --scrim: transparent;
    --text: #fdfbf7;
    --text-soft: rgba(255,255,255,0.78);
    --card-bg: rgba(20,20,26,0.42);
    --card-border: rgba(255,255,255,0.16);
    --icon-bg: rgba(255,255,255,0.08);
    --icon-border: rgba(255,255,255,0.16);
    --icon-color: #fff;
    --track-bg: rgba(255,255,255,0.26);
    --font-head: var(--serif);
    --font-body: var(--sans);
    --font-num: var(--sans);
    --main-align: 0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    min-height: 100dvh;
    background: #0b0c10;
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: var(--bg);
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: var(--scrim);
  }

  main {
    position: relative; z-index: 1;
    width: 100%; max-width: 36rem;
    margin: 0 auto 0 var(--main-align);
    flex: 1;
    padding: clamp(2.75rem, 8vh, 5.5rem) clamp(1.4rem, 6vw, 2.5rem) 1.5rem;
  }

  /* ---------- Hero ---------- */
  .eyebrow {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--font-body); font-size: 0.82rem; letter-spacing: 0.04em;
    color: var(--text-soft); margin-bottom: 0.95rem;
  }
  .eyebrow .star { width: 0.95rem; height: 0.95rem; color: var(--accent); }

  h1 {
    font-family: var(--font-head); font-weight: 700;
    font-size: clamp(2.05rem, 7vw, 3.25rem); line-height: 1.08;
    letter-spacing: -0.005em; margin: 0 0 0.85rem; text-wrap: balance;
    overflow-wrap: break-word;
  }
  .subtitle { font-family: var(--font-body); font-size: clamp(1rem, 3vw, 1.15rem); color: var(--text-soft); margin: 0 0 0.6rem; }
  .byline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.55rem; font-family: var(--font-body); font-size: 0.95rem; color: var(--text); }
  .byline .lead { color: var(--text-soft); }
  .byline .name:not(:last-child)::after { content: "·"; color: var(--accent); margin-left: 0.55rem; }

  /* ---------- Progress ---------- */
  .progress { margin-top: 1.7rem; }
  .plabel { font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.7rem; color: var(--text-soft); margin-bottom: 0.55rem; }
  .barrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.85rem; }
  .track { position: relative; min-width: 0; height: 3px; border-radius: 999px; background: var(--track-bg); overflow: hidden; }
  .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--accent); border-radius: 999px; transition: width 1.4s cubic-bezier(0.22,1,0.36,1); }
  .pval { font-family: var(--font-num); font-weight: 700; font-size: clamp(1.2rem, 4vw, 1.5rem); line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }

  /* ---------- Cards ---------- */
  .cards { margin-top: 1.6rem; display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
  .card {
    position: relative; display: flex; align-items: center; gap: 0.9rem;
    padding: 0.95rem 1.05rem; border-radius: 14px;
    background: var(--card-bg); border: 1px solid var(--card-border);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--text); text-decoration: none;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .icon { position: relative; flex: none; width: 2.7rem; height: 2.7rem; display: grid; place-items: center; border-radius: 10px; background: var(--icon-bg); border: 1px solid var(--icon-border); color: var(--icon-color); }
  .icon svg { width: 1.3rem; height: 1.3rem; }
  .body { min-width: 0; flex: 1; }
  .label { display: block; font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; line-height: 1.15; }
  .note { display: block; font-family: var(--font-body); font-size: 0.85rem; color: var(--text-soft); margin-top: 0.1rem; }
  .pill { position: relative; flex: none; font-family: var(--font-body); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-soft); border: 1px solid var(--card-border); border-radius: 999px; padding: 0.25rem 0.6rem; }
  .chev { display: none; flex: none; color: var(--text-soft); margin-left: 0.15rem; }

  footer { position: relative; z-index: 1; text-align: center; font-family: var(--font-body); color: var(--text-soft); font-size: 0.82rem; padding: 2rem 1.25rem 5.5rem; opacity: 0.85; }

  .reveal { opacity: 0; transform: translateY(12px); animation: rise 0.6s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity:1; transform:none; animation:none; } .card, .fill { transition:none; } }

  /* =========================================================
     VARIANT 1 — Warm Daylight Interior (light, serif)
     ========================================================= */
  [data-variant="1"] {
    --bg: url("assets/bg-1.jpg");
    --scrim: linear-gradient(105deg, rgba(247,242,233,0.55), rgba(247,242,233,0) 52%);
    --text: #2a2620; --text-soft: #6f675b;
    --card-bg: rgba(255,255,255,0.55); --card-border: rgba(40,30,20,0.12);
    --icon-bg: color-mix(in srgb, var(--accent) 15%, transparent); --icon-border: transparent; --icon-color: var(--accent);
    --track-bg: rgba(40,30,20,0.14);
  }
  [data-variant="1"] .chev { display: block; }

  /* =========================================================
     VARIANT 2 — Sunset Mountain (centered, icon tiles)
     ========================================================= */
  [data-variant="2"] {
    --bg: url("assets/bg-2.jpg");
    --scrim: linear-gradient(180deg, rgba(0,0,0,0.4), rgba(0,0,0,0.05) 38%, rgba(0,0,0,0.45));
  }
  [data-variant="2"] main { max-width: 46rem; margin: 0 auto; text-align: center; }
  [data-variant="2"] .eyebrow { justify-content: center; }
  [data-variant="2"] .byline { justify-content: center; }
  [data-variant="2"] .plabel { text-align: center; }
  [data-variant="2"] .cards { grid-template-columns: repeat(4, 1fr); gap: 0.6rem; }
  [data-variant="2"] .card { flex-direction: column; text-align: center; gap: 0.55rem; padding: 1.1rem 0.4rem; }
  [data-variant="2"] .card:hover { transform: translateY(-3px); }
  [data-variant="2"] .icon { background: transparent; border: none; width: auto; height: auto; }
  [data-variant="2"] .icon svg { width: 1.75rem; height: 1.75rem; }
  [data-variant="2"] .body { flex: none; }
  [data-variant="2"] .note { display: none; }
  [data-variant="2"] .label { font-size: 0.98rem; }
  [data-variant="2"] .pill { border: none; padding: 0.1rem 0; font-size: 0.6rem; }
  @media (max-width: 460px) { [data-variant="2"] .cards { grid-template-columns: repeat(2, 1fr); } }

  /* =========================================================
     VARIANT 3 — Above the Clouds (timeline, segmented bar)
     ========================================================= */
  [data-variant="3"] {
    --bg: url("assets/bg-3.jpg");
    --scrim: linear-gradient(110deg, rgba(18,32,58,0.6), rgba(18,32,58,0.12) 58%);
    --card-bg: rgba(255,255,255,0.13); --card-border: rgba(255,255,255,0.22);
  }
  [data-variant="3"] .plabel { text-transform: none; letter-spacing: 0; font-size: 0.85rem; }
  [data-variant="3"] .track { height: 6px; background: transparent; border-radius: 0; overflow: visible; }
  [data-variant="3"] .track::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.32) 0 16px, transparent 16px 22px); }
  [data-variant="3"] .fill { background: repeating-linear-gradient(90deg, var(--accent) 0 16px, transparent 16px 22px); border-radius: 0; }
  [data-variant="3"] .cards { padding-left: 1.5rem; position: relative; }
  [data-variant="3"] .cards::before { content: ""; position: absolute; left: 0.35rem; top: 0.6rem; bottom: 0.6rem; width: 2px; background: rgba(255,255,255,0.35); }
  [data-variant="3"] .card::after { content: ""; position: absolute; left: -1.18rem; top: 50%; transform: translateY(-50%); width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,0.18); }

  /* =========================================================
     VARIANT 4 — Sketch Paper (hand-drawn)
     ========================================================= */
  [data-variant="4"] {
    --bg: url("assets/paper-mobile.jpg");
    --scrim: transparent;
    --text: #23201b; --text-soft: #6b6356; --ink: #23201b;
    --card-bg: transparent; --card-border: transparent;
    --icon-bg: transparent; --icon-border: transparent; --icon-color: #23201b;
    --track-bg: transparent;
    --font-head: var(--marker); --font-body: var(--hand); --font-num: var(--marker);
  }
  @media (min-width: 720px) { [data-variant="4"] body::before { background-image: url("assets/paper-web.jpg"); } }
  [data-variant="4"] .plabel { text-transform: none; letter-spacing: 0; font-size: 1rem; }
  [data-variant="4"] .eyebrow .star { filter: url(#roughLite); }
  [data-variant="4"] .track { height: 1.5rem; overflow: visible; }
  [data-variant="4"] .track::before { content: ""; position: absolute; inset: 0; border: 2.5px solid var(--ink); border-radius: 10px; filter: url(#rough); }
  [data-variant="4"] .fill { top: 4px; bottom: 4px; left: 4px; background: repeating-linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 7px); filter: url(#rough2); border-radius: 6px; }
  [data-variant="4"] .pval { font-size: clamp(1.7rem, 7vw, 2.2rem); }
  [data-variant="4"] .card { background: transparent; border: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  [data-variant="4"] .card::before { content: ""; position: absolute; inset: 0; border: 2.5px solid var(--ink); border-radius: 16px; filter: url(#rough); transition: border-color 0.18s ease; }
  [data-variant="4"] .card:nth-child(even)::before { filter: url(#rough2); }
  [data-variant="4"] .card:hover { transform: translateY(-2px) rotate(-0.35deg); }
  [data-variant="4"] .card:hover::before { border-color: var(--accent); }
  [data-variant="4"] .icon::before { content: ""; position: absolute; inset: 0; border: 2.5px solid var(--ink); border-radius: 12px; filter: url(#roughLite); }
  [data-variant="4"] .icon svg { filter: url(#roughLite); width: 1.4rem; height: 1.4rem; }
  [data-variant="4"] .label { font-size: 1.4rem; line-height: 1.05; }
  [data-variant="4"] .note { font-size: 0.95rem; }
  [data-variant="4"] .pill { border: none; color: var(--ink); }
  [data-variant="4"] .pill::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--ink); border-radius: 999px; filter: url(#roughLite); }

  /* =========================================================
     VARIANT 5 — Twilight (minimal divider rows)
     ========================================================= */
  [data-variant="5"] {
    --bg: url("assets/bg-5.jpg");
    --scrim: linear-gradient(180deg, rgba(6,12,32,0.45), rgba(6,12,32,0) 45%);
  }
  [data-variant="5"] .plabel { display: none; }
  [data-variant="5"] .cards { gap: 0; }
  [data-variant="5"] .card { background: transparent; border: none; border-radius: 0; -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom: 1px solid rgba(255,255,255,0.16); padding: 0.9rem 0.2rem; }
  [data-variant="5"] .card:hover { transform: none; border-color: transparent; border-bottom-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.04); }
  [data-variant="5"] .icon { background: transparent; border: none; }
  [data-variant="5"] .chev { display: block; }

  /* =========================================================
     VARIANT 6 — Cozy Night Desk (glassy dark cards)
     ========================================================= */
  [data-variant="6"] {
    --bg: url("assets/bg-6.jpg");
    --scrim: linear-gradient(110deg, rgba(0,0,0,0.55), rgba(0,0,0,0.12) 62%);
    --card-bg: rgba(18,16,22,0.5); --card-border: rgba(255,255,255,0.15);
    --icon-bg: rgba(255,255,255,0.07); --icon-border: rgba(255,255,255,0.14);
  }
  [data-variant="6"] .plabel { display: none; }
  [data-variant="6"] .track { height: 7px; }
  [data-variant="6"] .chev { display: block; }

  /* ---------- Variant switcher ---------- */
  .switcher {
    position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 0.25rem;
    padding: 0.4rem 0.55rem; border-radius: 999px;
    background: rgba(14,14,18,0.72); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 12px 34px -12px rgba(0,0,0,0.6);
    font-family: var(--sans);
  }
  .sw-btn { width: 1.85rem; height: 1.85rem; border-radius: 50%; border: none; background: transparent; color: rgba(255,255,255,0.7); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .sw-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .sw-btn.active { background: var(--accent); color: #fff; }
  .sw-arrow { background: transparent; border: none; color: rgba(255,255,255,0.7); font-size: 1.15rem; line-height: 1; cursor: pointer; padding: 0 0.3rem; }
  .sw-arrow:hover { color: #fff; }
  .sw-name { color: rgba(255,255,255,0.85); font-size: 0.76rem; padding: 0 0.55rem 0 0.35rem; white-space: nowrap; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough" x="-20%" y="-40%" width="140%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="rough2" x="-20%" y="-40%" width="140%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="13" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="roughLite" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/></filter>
  </svg>

  <main>
    <p class="eyebrow reveal" style="animation-delay:0s">
      <svg class="star" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 2l3.4 9.6L29 15l-9.6 3.4L16 28l-3.4-9.6L3 15l9.6-3.4z"/></svg>
      <span id="eyebrow-text">Class Consulting Project</span>
    </p>
    <h1 class="reveal" id="title" style="animation-delay:0.06s"></h1>
    <p class="subtitle reveal" id="subtitle" style="animation-delay:0.12s"></p>
    <div class="byline reveal" id="byline" style="animation-delay:0.18s"></div>

    <div class="progress reveal" id="progress" style="animation-delay:0.24s" role="group" aria-label="Project progress">
      <div class="plabel" id="plabel">Project progress</div>
      <div class="barrow">
        <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="ptrack"><div class="fill" id="pfill"></div></div>
        <span class="pval" id="pval" aria-live="polite">0%</span>
      </div>
    </div>

    <section class="cards" id="cards" aria-label="Project resources"></section>
  </main>

  <footer class="reveal" id="footer" style="animation-delay:0.5s"></footer>

  <script>
    const SITE = {
      eyebrow: "Class Consulting Project",
      title: "AI & Cloud-Powered Family Support Prototypes",
      subtitle: "Consulting for Dr. Walker's Family Life Class.",
      authors: ["Katlyn V.", "Shondalle C.", "Hernan L."],
      progress: { value: 64, label: "Project progress" },
      footer: "Dr. Walker's Family Life Class · 2026",
      cards: [
        { icon: "play",  label: "Live Demo",      note: "Compass — the working prototype", href: "#TODO-demo-url" },
        { icon: "code",  label: "GitHub Repo",    note: "Source code",                     href: "#TODO-repo-url" },
        { icon: "doc",   label: "Concept Doc",    note: "Design spec & rationale",         href: "#TODO-doc-url" },
        { icon: "video", label: "Video & Slides", note: "Walkthrough & presentation",      href: "#TODO-video-url" },
      ],
    };

    const ICONS = {
      play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 4l13 8-13 8z"/></svg>',
      code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l-6-6 6-6M15 6l6 6-6 6"/></svg>',
      doc:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
      video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M22 8l-6 4 6 4z"/></svg>',
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
    };
    const CHEV = '<span class="chev" aria-hidden="true">›</span>';

    document.getElementById("eyebrow-text").textContent = SITE.eyebrow;
    document.getElementById("title").textContent = SITE.title;
    document.getElementById("subtitle").textContent = SITE.subtitle;
    document.getElementById("footer").textContent = SITE.footer;

    const byline = document.getElementById("byline");
    const lead = document.createElement("span"); lead.className = "lead"; lead.textContent = "By"; byline.appendChild(lead);
    SITE.authors.forEach((name) => { const el = document.createElement("span"); el.className = "name"; el.textContent = name; byline.appendChild(el); });

    const prog = SITE.progress;
    if (prog && typeof prog.value === "number") {
      const target = Math.max(0, Math.min(100, prog.value));
      const fill = document.getElementById("pfill"), valEl = document.getElementById("pval");
      document.getElementById("ptrack").setAttribute("aria-valuenow", String(target));
      document.getElementById("plabel").textContent = prog.label || "Project progress";
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) { fill.style.width = target + "%"; valEl.textContent = target + "%"; }
      else {
        requestAnimationFrame(() => { fill.style.width = target + "%"; });
        const dur = 1400, t0 = performance.now();
        const tick = (now) => { const t = Math.min(1, (now - t0) / dur); valEl.textContent = Math.round((1 - Math.pow(1 - t, 3)) * target) + "%"; if (t < 1) requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      }
    }

    const grid = document.getElementById("cards");
    SITE.cards.forEach((card, i) => {
      const pending = !card.href || card.href.startsWith("#TODO") || card.href === "#";
      const a = document.createElement("a");
      a.className = "card reveal"; a.style.animationDelay = 0.3 + i * 0.07 + "s";
      if (pending) { a.setAttribute("aria-disabled", "true"); a.addEventListener("click", (e) => e.preventDefault()); }
      else { a.href = card.href; if (/^https?:/.test(card.href)) { a.target = "_blank"; a.rel = "noopener noreferrer"; } }
      a.innerHTML = '<span class="icon">' + (ICONS[card.icon] || ICONS.link) + '</span>'
        + '<span class="body"><span class="label"></span><span class="note"></span></span>'
        + (pending ? '<span class="pill">Soon</span>' : '') + CHEV;
      a.querySelector(".label").textContent = card.label;
      a.querySelector(".note").textContent = card.note;
      grid.appendChild(a);
    });

    /* ---------- variant switcher ---------- */
    const VARIANTS = [
      { id: 1, name: "Daylight" }, { id: 2, name: "Sunset" }, { id: 3, name: "Clouds" },
      { id: 4, name: "Sketch" }, { id: 5, name: "Twilight" }, { id: 6, name: "Night" },
    ];
    const root = document.documentElement;
    const cur = () => parseInt(root.dataset.variant || "1", 10);
    function setVariant(n, push) {
      n = ((n - 1 + 6) % 6) + 1;
      root.dataset.variant = n;
      if (push !== false) history.replaceState(null, "", "#v=" + n);
      document.querySelectorAll(".sw-btn").forEach((b) => b.classList.toggle("active", +b.dataset.n === n));
      const nm = VARIANTS.find((v) => v.id === n);
      const lbl = document.getElementById("sw-name"); if (lbl) lbl.textContent = n + " · " + nm.name;
    }
    const sw = document.createElement("nav");
    sw.className = "switcher"; sw.setAttribute("aria-label", "Theme variant");
    sw.innerHTML = '<button class="sw-arrow" id="sw-prev" aria-label="Previous">‹</button>'
      + VARIANTS.map((v) => '<button class="sw-btn" data-n="' + v.id + '" aria-label="Variant ' + v.id + ' ' + v.name + '">' + v.id + '</button>').join('')
      + '<button class="sw-arrow" id="sw-next" aria-label="Next">›</button><span class="sw-name" id="sw-name"></span>';
    document.body.appendChild(sw);
    sw.addEventListener("click", (e) => { const b = e.target.closest(".sw-btn"); if (b) setVariant(+b.dataset.n); });
    document.getElementById("sw-prev").onclick = () => setVariant(cur() - 1);
    document.getElementById("sw-next").onclick = () => setVariant(cur() + 1);
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") setVariant(cur() + 1);
      else if (e.key === "ArrowLeft") setVariant(cur() - 1);
      else if (/^[1-6]$/.test(e.key)) setVariant(+e.key);
    });
    const m = (location.hash.match(/v=(\d)/) || location.hash.match(/(\d)/) || location.search.match(/v=(\d)/));
    setVariant(m ? +m[1] : 1, false);
  </script>
</body>
</html>
